name: Update contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: '13 10 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-graph.yml'
      - 'scripts/generate_contribution_graph.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contribution_graph.py
      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution graph"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not push contribution graph after retries" >&2
            exit 1
          fi
